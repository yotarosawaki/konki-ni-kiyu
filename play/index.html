<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>婚期に消ゆ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* 8bitゲームの画面は黒一色の世界。テーマ切替は持たず、色はすべて明示する */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --fg: #fcfcfc;
    --dim: #7c7c7c;
    --gold: #f8b800;
    --red: #f83800;
    --sky: #3cbcfc;
    --win: #000000;
    --font: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font); font-size: 17px; line-height: 1.65;
    padding: 0 16px; -webkit-font-smoothing: none;
  }
  #app {
    max-width: 800px; margin: 0 auto; padding-block: 16px 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .win {
    background: var(--win); border: 3px solid var(--fg); border-radius: 8px;
    box-shadow: inset 0 0 0 3px var(--win), inset 0 0 0 5px var(--fg);
    padding: 12px 14px; position: relative;
  }
  #top { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px; }
  #cmds.two li button { padding-left: 18px; white-space: nowrap; }
  #picwin { padding: 9px; overflow: hidden; cursor: pointer; }
  #pic { display: block; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #cmdwin { display: flex; flex-direction: column; gap: 6px; }
  #cmdtitle { color: var(--gold); font-size: 14px; letter-spacing: .1em; min-height: 1.4em; }
  ul { list-style: none; margin: 0; padding: 0; }
  #cmds { display: grid; grid-template-columns: 1fr; gap: 2px; }
  #cmds.two { grid-template-columns: 1fr 1fr; }
  #choices { display: grid; gap: 2px; margin-top: 8px; }
  li button, li a.ext {
    all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer;
    padding: 3px 4px 3px 22px; position: relative; color: var(--fg); font: inherit; line-height: 1.45;
  }
  li button::before, li a.ext::before { content: "▶"; position: absolute; left: 3px; top: 3px; color: var(--red); visibility: hidden; font-size: .9em; }
  li button.cur::before, li a.ext.cur::before { visibility: visible; animation: blink .8s steps(1) infinite; }
  li button.cur, li a.ext.cur { color: var(--gold); }
  li a.ext { text-decoration: underline; text-underline-offset: 4px; }
  li button.back { color: var(--dim); }
  li button.back.cur { color: var(--gold); }
  li button:focus-visible, li a.ext:focus-visible { outline: 2px dashed var(--sky); outline-offset: -2px; }
  #msgwin { min-height: 9.5em; cursor: pointer; }
  /* 婚活アドバイザーの診断：吹き出し風に色とツノを変える */
  #msgwin.bubble { background: #1a0033; border-color: #c9a8ff; box-shadow: inset 0 0 0 3px #1a0033, inset 0 0 0 5px #c9a8ff; }
  #msgwin.bubble::before {
    content: ""; position: absolute; left: 28px; top: -14px; width: 0; height: 0;
    border: 9px solid transparent; border-bottom-color: #c9a8ff;
  }
  #msgwin.bubble::after {
    content: ""; position: absolute; left: 31px; top: -8px; width: 0; height: 0;
    border: 6px solid transparent; border-bottom-color: #1a0033;
  }
  #msgtext { white-space: pre-wrap; word-break: break-all; margin: 0; min-height: 3.3em; }
  #more { position: absolute; right: 16px; bottom: 8px; color: var(--fg); animation: blink .7s steps(1) infinite; }
  #status {
    display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--dim);
    min-height: 1.5em; padding-inline: 4px; font-variant-numeric: tabular-nums;
  }
  .st-heart { color: #f878f8; }
  .pop {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: #000; border: 2px solid var(--fg); padding: 2px 10px; font-size: 14px; white-space: nowrap;
    animation: pop 1.6s steps(8) forwards; pointer-events: none;
  }
  .pop.neg { color: #f878f8; } .pop.pos { color: #58d854; }
  #foot { color: var(--dim); font-size: 12px; text-align: center; }
  #privacy { color: var(--dim); font-size: 12px; line-height: 1.7; text-align: center; max-width: 34em; margin: 0 auto; }
  #privacy a { color: var(--sky); text-underline-offset: 3px; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pop { 0% { opacity: 0; top: 24px; } 15% { opacity: 1; top: 14px; } 80% { opacity: 1; } 100% { opacity: 0; top: 6px; } }
  @media (max-width: 620px) {
    body { font-size: 15px; }
    #top { grid-template-columns: 1fr; }
    #cmdwin { padding: 8px 10px; }
    #cmds { grid-template-columns: 1fr 1fr; }
    #cmds.two { grid-template-columns: 1fr 1fr; }
    #msgwin { min-height: 10.5em; }
  }
  @media (prefers-reduced-motion: reduce) {
    li button.cur::before, #more { animation: none; }
    .pop { animation-timing-function: linear; }
  }
</style>

<div id="app">
  <div id="top">
    <div class="win" id="picwin"><canvas id="pic" width="192" height="128" aria-label="ゲーム画面"></canvas></div>
    <div class="win" id="cmdwin">
      <div id="cmdtitle"></div>
      <ul id="cmds"></ul>
    </div>
  </div>
  <div class="win" id="msgwin" aria-live="polite">
    <p id="msgtext"></p>
    <ul id="choices"></ul>
    <span id="more" hidden>▼</span>
  </div>
  <div id="status"></div>
  <div id="foot">クリック／タップ・↑↓・Enter で すすむ　Esc で もどる</div>
  <div id="privacy" data-analytics-note hidden>このサイトでは、利用状況を知るためにGoogleアナリティクスを使っています。閲覧したページや操作の情報が、Cookieなどを通じてGoogleに送られます（名前など個人を特定する情報は含みません）。<a href="https://policies.google.com/technologies/partner-sites?hl=ja" target="_blank" rel="noopener">詳しくはこちら</a></div>
</div>

<script src="js/analytics.js"></script>
<script src="js/counter.js"></script>
<script src="js/gfx.js"></script>
<script src="js/advisor.js"></script>
<script src="js/story.js"></script>
<script src="js/bgm.js"></script>
